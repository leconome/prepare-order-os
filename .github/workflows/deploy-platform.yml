# ===========================================
# Platform Deployment Workflow
# ===========================================
# Deploys the Econome platform to production VPS
#
# Triggers:
#   - Push to main branch (api, admin, infrastructure changes)
#   - Manual dispatch from GitHub Actions UI
#
# Runs on self-hosted runner on the VPS itself

name: Deploy Platform

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'docker-compose.prod.yml'
      - 'infrastructure/**'
      - '.github/workflows/deploy-platform.yml'
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to rebuild (api, admin, traefik, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - api
          - admin
          - traefik
      migrate:
        description: 'Run database migrations'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux, x64, econome]

    steps:
      - name: Pull latest code
        run: |
          echo "=== Pulling latest code ==="
          git config --global --add safe.directory /opt/econome
          cd /opt/econome
          git fetch origin
          git reset --hard origin/main

      - name: Detect changes
        id: changes
        run: |
          cd /opt/econome
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVICE="${{ github.event.inputs.services }}"
            if [ "$SERVICE" = "all" ]; then
              echo "api=true" >> $GITHUB_OUTPUT
              echo "admin=true" >> $GITHUB_OUTPUT
              echo "traefik=true" >> $GITHUB_OUTPUT
            else
              echo "api=$([[ $SERVICE == "api" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
              echo "admin=$([[ $SERVICE == "admin" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
              echo "traefik=$([[ $SERVICE == "traefik" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            fi
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
            echo "Changed files: $CHANGED"
            echo "api=$([[ $CHANGED == *apps/api/* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "admin=$([[ $CHANGED == *apps/admin/* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
            echo "traefik=$([[ $CHANGED == *infrastructure/* ]] || [[ $CHANGED == *docker-compose* ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          fi

      - name: Rebuild API
        if: steps.changes.outputs.api == 'true'
        run: |
          cd /opt/econome
          echo "=== Rebuilding API ==="
          docker compose -f docker-compose.prod.yml --env-file .env.production build api
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d api

      - name: Rebuild Admin
        if: steps.changes.outputs.admin == 'true'
        run: |
          cd /opt/econome
          echo "=== Rebuilding Admin ==="
          docker compose -f docker-compose.prod.yml --env-file .env.production build admin
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d admin

      - name: Restart Traefik
        if: steps.changes.outputs.traefik == 'true'
        run: |
          cd /opt/econome
          echo "=== Restarting Traefik ==="
          docker compose -f docker-compose.prod.yml --env-file .env.production up -d traefik

      - name: Run migrations
        if: github.event.inputs.migrate == 'true'
        run: |
          cd /opt/econome
          echo "=== Running migrations ==="
          docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api pnpm db:push

      - name: Health check
        run: |
          sleep 10
          echo "=== Health Check ==="
          curl -sf http://localhost:3001/health && echo " API: OK" || echo " API: FAILED"
          echo ""
          echo "=== Container Status ==="
          docker ps --format "table {{.Names}}\t{{.Status}}" | grep -E "econome|traefik"

      - name: Cleanup old images
        run: docker image prune -f

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Rebuilt |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| API | ${{ steps.changes.outputs.api }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin | ${{ steps.changes.outputs.admin }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Traefik | ${{ steps.changes.outputs.traefik }} |" >> $GITHUB_STEP_SUMMARY

name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        id: build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/build.log
        continue-on-error: true

      - name: Comment PR on failure
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/build.log', 'utf8');
            const lines = log.split('\n');
            const errors = lines.filter(l => /error|Error|ERR_|failed/i.test(l)).slice(0, 30);
            const body = `### ❌ Build Failed\n\n\`\`\`\n${errors.join('\n') || lines.slice(-30).join('\n')}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

# Production Docker Compose for Econome Platform
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.production up -d

services:
  # ===================
  # Reverse Proxy (Traefik)
  # ===================
  traefik:
    image: traefik:latest
    container_name: econome-traefik
    restart: unless-stopped
    command:
      # API and Dashboard
      - "--api.dashboard=false"
      - "--api.insecure=false"
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=platform_network"
      # File provider for dynamic configuration
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt ACME
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/etc/traefik/acme
      - traefik_logs:/var/log/traefik
    networks:
      - platform_network
    environment:
      - DOMAIN=${DOMAIN}
      - DOCKER_API_VERSION=1.45

  # ===================
  # Platform Database
  # ===================
  platform-db:
    image: postgres:15-alpine
    container_name: econome-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    networks:
      - platform_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Database not exposed externally - only accessible within Docker network

  # ===================
  # Provisioning API
  # ===================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: econome-api
    restart: unless-stopped
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgres://platform:${POSTGRES_PASSWORD}@platform-db:5432/platform
      - API_KEY=${API_KEY}
      - DOMAIN=${DOMAIN}
      - DEFAULT_MEDUSA_IMAGE=${DEFAULT_MEDUSA_IMAGE:-ghcr.io/leconome/medusa:latest}
      - DEFAULT_CLIENT_IMAGE=${DEFAULT_CLIENT_IMAGE:-ghcr.io/leconome/client:latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - platform_network
    labels:
      - "traefik.enable=true"
      # HTTP router (redirects to HTTPS)
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=api-ratelimit@file,security-headers@file"
      - "traefik.http.services.api.loadbalancer.server.port=3001"

  # ===================
  # Admin Dashboard
  # ===================
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=https://api.${DOMAIN}
        - NEXT_PUBLIC_DOMAIN=${DOMAIN}
    container_name: econome-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.${DOMAIN}
      - NEXT_PUBLIC_DOMAIN=${DOMAIN}
    networks:
      - platform_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.${DOMAIN}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls=true"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admin.middlewares=security-headers@file"
      - "traefik.http.services.admin.loadbalancer.server.port=3000"

  # ===================
  # Database Browser (pgweb)
  # ===================
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: econome-pgweb
    restart: unless-stopped
    environment:
      - PGWEB_DATABASE_URL=postgres://platform:${POSTGRES_PASSWORD}@platform-db:5432/platform?sslmode=disable
    networks:
      - platform_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgweb.rule=Host(`pgweb.${DOMAIN}`)"
      - "traefik.http.routers.pgweb.entrypoints=websecure"
      - "traefik.http.routers.pgweb.tls=true"
      - "traefik.http.routers.pgweb.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pgweb.middlewares=security-headers@file"
      - "traefik.http.services.pgweb.loadbalancer.server.port=8081"
    profiles:
      - tools

  # ===================
  # GitHub Actions Runner (Self-hosted)
  # ===================
  github-runner:
    image: myoung34/github-runner:latest
    container_name: econome-github-runner
    restart: unless-stopped
    environment:
      - REPO_URL=${GITHUB_REPO_URL:-https://github.com/leconome/prepare-order-os}
      - RUNNER_NAME=${GITHUB_RUNNER_NAME:-econome-runner}
      - RUNNER_TOKEN=${GITHUB_RUNNER_TOKEN}
      - RUNNER_WORKDIR=/opt/econome/_work
      - LABELS=self-hosted,linux,x64,econome
      - DISABLE_AUTO_UPDATE=true
      - DISABLE_AUTOMATIC_DEREGISTRATION=true
      - CONFIGURED_ACTIONS_RUNNER_FILES_DIR=/home/runner/actions-runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/econome:/opt/econome
      - github_runner_config:/home/runner/actions-runner
    networks:
      - platform_network
    profiles:
      - runner

volumes:
  platform_db_data:
  traefik_acme:
  traefik_logs:
  github_runner_config:

networks:
  platform_network:
    name: platform_network
    external: true

# Dynamic Traefik configuration for platform services
# Tenant routes are configured via Docker labels when containers are created

http:
  routers:
    # Platform API
    api:
      rule: "Host(`api.localhost`)"
      entrypoints:
        - web
      service: api
      priority: 10

    # Platform Admin
    admin:
      rule: "Host(`admin.localhost`)"
      entrypoints:
        - web
      service: admin
      priority: 10

    # Local dev tenant - routes to host machine for hot reload
    dev-tenant:
      rule: "Host(`dev.localhost`)"
      entrypoints:
        - web
      service: dev-local
      priority: 10

    # Catch-all for tenant subdomains (handled by Docker labels on tenant containers)
    tenant-catchall:
      rule: "HostRegexp(`{subdomain:[a-z0-9-]+}.localhost`)"
      entrypoints:
        - web
      service: noop@internal
      priority: 1

  services:
    # Platform API service
    api:
      loadBalancer:
        servers:
          - url: "http://econome-api:3001"

    # Platform Admin service
    admin:
      loadBalancer:
        servers:
          - url: "http://econome-admin:3000"

    # Local dev service - points to host machine
    dev-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:9000"

  middlewares:
    # Rate limiting for API
    api-ratelimit:
      rateLimit:
        average: 100
        burst: 50

    # Security headers
    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    # CORS for API
    api-cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
        accessControlAllowOriginList:
          - "http://admin.localhost"
          - "http://localhost:3000"
        accessControlMaxAge: 100
        addVaryHeader: true

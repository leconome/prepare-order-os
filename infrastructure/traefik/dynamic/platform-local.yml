# Dynamic Traefik configuration for LOCAL development
# All frontend apps run on host machine, only infra runs in Docker
# Use this config when running `pnpm dev` (local turbo mode)

http:
  routers:
    # Platform API (still in Docker)
    api:
      rule: "Host(`api.localhost`)"
      entrypoints:
        - web
      service: api
      priority: 10

    # Platform Admin (local dev server)
    admin:
      rule: "Host(`admin.localhost`)"
      entrypoints:
        - web
      service: admin-local
      priority: 10

    # Platform Client (local dev server)
    client:
      rule: "Host(`client.localhost`)"
      entrypoints:
        - web
      service: client-local
      priority: 10

    # Local dev tenant client
    dev-tenant:
      rule: "Host(`dev.localhost`)"
      entrypoints:
        - web
      service: client-local
      priority: 10

    # Local dev tenant store API (Hono)
    dev-tenant-store:
      rule: "Host(`store.dev.localhost`)"
      entrypoints:
        - web
      service: store-local
      priority: 10

    # Catch-all for store subdomains
    store-catchall:
      rule: "HostRegexp(`store.{subdomain:[a-z0-9-]+}.localhost`)"
      entrypoints:
        - web
      service: noop@internal
      priority: 2

    # Catch-all for tenant subdomains
    tenant-catchall:
      rule: "HostRegexp(`{subdomain:[a-z0-9-]+}.localhost`)"
      entrypoints:
        - web
      service: noop@internal
      priority: 1

  services:
    # Platform API service (still in Docker)
    api:
      loadBalancer:
        servers:
          - url: "http://econome-api:3001"

    # Admin running locally on host machine
    admin-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"

    # Client running locally on host machine
    client-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3002"

    # Store (Hono API) running locally on host machine
    store-local:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:9000"

  middlewares:
    # Rate limiting for API
    api-ratelimit:
      rateLimit:
        average: 100
        burst: 50

    # Security headers
    security-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    # CORS for API
    api-cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
          - X-Employee-PIN
        accessControlAllowOriginList:
          - "http://admin.localhost"
          - "http://client.localhost"
          - "http://localhost:3000"
          - "http://localhost:3002"
        accessControlMaxAge: 100
        addVaryHeader: true

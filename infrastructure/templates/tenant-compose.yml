# Template for tenant Docker Compose
# Variables: {{TENANT_SLUG}}, {{TENANT_SUBDOMAIN}}, {{DB_PASSWORD}}, {{JWT_SECRET}}, {{COOKIE_SECRET}}, {{IMAGE_TAG}}, {{CLIENT_IMAGE_TAG}}
# Production Variables: {{DOMAIN}} (e.g., prepareos.fr)
# Ports: {{POSTGRES_PORT}}, {{REDIS_PORT}}, {{MEDUSA_API_PORT}}, {{MEDUSA_ADMIN_PORT}}, {{CLIENT_PORT}}

version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: tenant_{{TENANT_SLUG}}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa_{{TENANT_SLUG}}
      POSTGRES_USER: medusa_{{TENANT_SLUG}}
      POSTGRES_PASSWORD: "{{DB_PASSWORD}}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - tenant_{{TENANT_SLUG}}_postgres_data:/var/lib/postgresql/data
    networks:
      - tenant_{{TENANT_SLUG}}_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa_{{TENANT_SLUG}} -d medusa_{{TENANT_SLUG}}"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "econome.tenant.slug={{TENANT_SLUG}}"
      - "econome.service=postgres"

  redis:
    image: redis:7-alpine
    container_name: tenant_{{TENANT_SLUG}}_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - tenant_{{TENANT_SLUG}}_redis_data:/data
    networks:
      - tenant_{{TENANT_SLUG}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - "econome.tenant.slug={{TENANT_SLUG}}"
      - "econome.service=redis"

  medusa:
    image: "{{IMAGE_TAG}}"
    container_name: tenant_{{TENANT_SLUG}}_medusa
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://medusa_{{TENANT_SLUG}}:{{DB_PASSWORD}}@postgres:5432/medusa_{{TENANT_SLUG}}
      - REDIS_URL=redis://redis:6379
      - CACHE_REDIS_URL=redis://redis:6379
      - JWT_SECRET={{JWT_SECRET}}
      - COOKIE_SECRET={{COOKIE_SECRET}}
      - STORE_CORS=https://{{TENANT_SUBDOMAIN}}.{{DOMAIN}}
      - ADMIN_CORS=https://store.{{TENANT_SUBDOMAIN}}.{{DOMAIN}}
      - AUTH_CORS=https://{{TENANT_SUBDOMAIN}}.{{DOMAIN}},https://store.{{TENANT_SUBDOMAIN}}.{{DOMAIN}}
      - MEDUSA_BACKEND_URL=https://store.{{TENANT_SUBDOMAIN}}.{{DOMAIN}}
    networks:
      - tenant_{{TENANT_SLUG}}_network
      - platform_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "econome.tenant.slug={{TENANT_SLUG}}"
      - "econome.service=medusa"
      - "traefik.enable=true"
      - "traefik.docker.network=platform_network"
      # Medusa serves Store API at store.{tenant}.{domain}
      - "traefik.http.routers.{{TENANT_SLUG}}-store.rule=Host(`store.{{TENANT_SUBDOMAIN}}.{{DOMAIN}}`)"
      - "traefik.http.routers.{{TENANT_SLUG}}-store.entrypoints=websecure"
      - "traefik.http.routers.{{TENANT_SLUG}}-store.tls=true"
      - "traefik.http.routers.{{TENANT_SLUG}}-store.tls.certresolver=letsencrypt"
      - "traefik.http.routers.{{TENANT_SLUG}}-store.service={{TENANT_SLUG}}-store"
      - "traefik.http.routers.{{TENANT_SLUG}}-store.middlewares=tenant-cors@file,security-headers@file"
      - "traefik.http.services.{{TENANT_SLUG}}-store.loadbalancer.server.port=9000"

  client:
    image: "{{CLIENT_IMAGE_TAG}}"
    container_name: tenant_{{TENANT_SLUG}}_client
    restart: unless-stopped
    depends_on:
      medusa:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_STORE_API_URL=https://store.{{TENANT_SUBDOMAIN}}.{{DOMAIN}}
      - NEXT_PUBLIC_DOMAIN={{DOMAIN}}
    networks:
      - tenant_{{TENANT_SLUG}}_network
      - platform_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "econome.tenant.slug={{TENANT_SLUG}}"
      - "econome.service=client"
      - "traefik.enable=true"
      - "traefik.docker.network=platform_network"
      # Client serves storefront at {tenant}.{domain}
      - "traefik.http.routers.{{TENANT_SLUG}}-client.rule=Host(`{{TENANT_SUBDOMAIN}}.{{DOMAIN}}`)"
      - "traefik.http.routers.{{TENANT_SLUG}}-client.entrypoints=websecure"
      - "traefik.http.routers.{{TENANT_SLUG}}-client.tls=true"
      - "traefik.http.routers.{{TENANT_SLUG}}-client.tls.certresolver=letsencrypt"
      - "traefik.http.routers.{{TENANT_SLUG}}-client.service={{TENANT_SLUG}}-client"
      - "traefik.http.routers.{{TENANT_SLUG}}-client.middlewares=security-headers@file"
      - "traefik.http.services.{{TENANT_SLUG}}-client.loadbalancer.server.port=3002"

volumes:
  tenant_{{TENANT_SLUG}}_postgres_data:
  tenant_{{TENANT_SLUG}}_redis_data:

networks:
  tenant_{{TENANT_SLUG}}_network:
    driver: bridge
  platform_network:
    external: true

# Production Docker Stack for Econome Platform (Swarm Mode)
# Usage: docker stack deploy -c docker-stack.prod.yml econome
#
# Prerequisites:
#   1. Initialize swarm: docker swarm init
#   2. Create network: docker network create --driver overlay --attachable platform_network
#   3. Create secrets: docker secret create postgres_password <file>
#   4. Deploy: docker stack deploy -c docker-stack.prod.yml econome

version: "3.8"

services:
  # ===================
  # Reverse Proxy (Traefik)
  # ===================
  traefik:
    image: traefik:v3.0
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/etc/traefik/acme
      - traefik_logs:/var/log/traefik
    networks:
      - platform_network
    environment:
      - DOMAIN=${DOMAIN}
    command:
      # API and Dashboard
      - "--api.dashboard=false"
      - "--api.insecure=false"
      # Docker Swarm provider
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=platform_network"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      # File provider for dynamic configuration
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt ACME
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ===================
  # Platform Database
  # ===================
  platform-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    networks:
      - platform_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  # ===================
  # Provisioning API
  # ===================
  api:
    image: ${API_IMAGE:-econome-api:latest}
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgres://platform:${POSTGRES_PASSWORD}@platform-db:5432/platform
      - API_KEY=${API_KEY}
      - DOMAIN=${DOMAIN}
      - DEFAULT_MEDUSA_IMAGE=${DEFAULT_MEDUSA_IMAGE:-ghcr.io/leconome/medusa:latest}
      - SWARM_MODE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - econome_backups:/opt/econome/backups
    networks:
      - platform_network
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
        - "traefik.http.routers.api.entrypoints=websecure"
        - "traefik.http.routers.api.tls=true"
        - "traefik.http.routers.api.tls.certresolver=letsencrypt"
        - "traefik.http.routers.api.middlewares=api-ratelimit@file,security-headers@file"
        - "traefik.http.services.api.loadbalancer.server.port=3001"

  # ===================
  # Admin Dashboard
  # ===================
  admin:
    image: ${ADMIN_IMAGE:-econome-admin:latest}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.${DOMAIN}
      - NEXT_PUBLIC_DOMAIN=${DOMAIN}
    networks:
      - platform_network
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.admin.rule=Host(`admin.${DOMAIN}`)"
        - "traefik.http.routers.admin.entrypoints=websecure"
        - "traefik.http.routers.admin.tls=true"
        - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
        - "traefik.http.routers.admin.middlewares=security-headers@file"
        - "traefik.http.services.admin.loadbalancer.server.port=3000"

volumes:
  platform_db_data:
  traefik_acme:
  traefik_logs:
  econome_backups:

networks:
  platform_network:
    external: true
    name: platform_network

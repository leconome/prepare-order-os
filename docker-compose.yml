services:
  # ===================
  # Reverse Proxy
  # ===================
  traefik:
    image: traefik:v3.0
    container_name: econome-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=platform_network"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - platform_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  # ===================
  # Platform Database
  # ===================
  platform-db:
    image: postgres:15-alpine
    container_name: econome-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    networks:
      - platform_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===================
  # Provisioning API
  # ===================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: econome-api
    restart: on-failure:3
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgres://platform:platform@platform-db:5432/platform
    volumes:
      - ./apps/api/src:/app/src:ro
      - ./apps/api/package.json:/app/package.json:ro
      - ./apps/api/tsconfig.json:/app/tsconfig.json:ro
      - ./apps/api/drizzle.config.ts:/app/drizzle.config.ts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - platform_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=3001"

  # ===================
  # Super Admin Dashboard
  # ===================
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: econome-admin
    restart: on-failure:3
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://api.localhost
    volumes:
      - ./apps/admin/src:/app/src:ro
      - ./apps/admin/public:/app/public:ro
      - ./apps/admin/package.json:/app/package.json:ro
      - ./apps/admin/tsconfig.json:/app/tsconfig.json:ro
      - ./apps/admin/next.config.js:/app/next.config.js:ro
      - ./apps/admin/tailwind.config.ts:/app/tailwind.config.ts:ro
      - ./apps/admin/postcss.config.js:/app/postcss.config.js:ro
    networks:
      - platform_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.localhost`)"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.services.admin.loadbalancer.server.port=3000"

  # ===================
  # Client Storefront
  # ===================
  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    container_name: econome-client
    restart: on-failure:3
    depends_on:
      - api
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_STORE_API_URL=http://store.dev.localhost
      - NEXT_PUBLIC_DOMAIN=localhost
    volumes:
      - ./apps/client/app:/app/app:ro
      - ./apps/client/public:/app/public:ro
      - ./apps/client/package.json:/app/package.json:ro
      - ./apps/client/tsconfig.json:/app/tsconfig.json:ro
      - ./apps/client/next.config.ts:/app/next.config.ts:ro
      - ./apps/client/postcss.config.mjs:/app/postcss.config.mjs:ro
    networks:
      - platform_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.rule=Host(`client.localhost`)"
      - "traefik.http.routers.client.entrypoints=web"
      - "traefik.http.services.client.loadbalancer.server.port=3002"

  # ===================
  # Store Database (Local Dev)
  # ===================
  store-db:
    image: postgres:15-alpine
    container_name: econome-store-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - store_db_data:/var/lib/postgresql/data
    networks:
      - platform_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-v2"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===================
  # Store Redis (Local Dev)
  # ===================
  store-redis:
    image: redis:7-alpine
    container_name: econome-store-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - store_redis_data:/var/lib/redis/data
    networks:
      - platform_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===================
  # GitHub Actions Runner (Self-hosted)
  # ===================
  github-runner:
    image: myoung34/github-runner:latest
    container_name: econome-github-runner
    restart: unless-stopped
    environment:
      - REPO_URL=${GITHUB_REPO_URL:-https://github.com/leconome/prepare-order-os}
      - RUNNER_NAME=${GITHUB_RUNNER_NAME:-econome-runner}
      - RUNNER_TOKEN=${GITHUB_RUNNER_TOKEN}
      - RUNNER_WORKDIR=/tmp/github-runner
      - LABELS=self-hosted,linux,x64,econome
      - DISABLE_AUTO_UPDATE=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - github_runner_data:/tmp/github-runner
    networks:
      - platform_network
    profiles:
      - runner

volumes:
  platform_db_data:
  store_db_data:
  store_redis_data:
  github_runner_data:

networks:
  platform_network:
    name: platform_network
    external: true
